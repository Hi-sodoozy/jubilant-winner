<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trivia admin – Iain Duguid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles-iain.css" />
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <div class="site-header-inner">
        <a href="index.html#hero" class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <div class="brand-text-primary">Iain Duguid</div>
            <div class="brand-text-secondary">Trivia questions</div>
          </div>
        </a>
        <a href="games.html" class="dashboard-back">Back to games</a>
      </div>
    </header>

    <main>
      <section class="section page-intro">
        <div class="section-inner">
          <h1 class="page-intro-title">Trivia admin</h1>
          <p class="page-intro-subtitle">Ten questions for one date. Four answers each.</p>
        </div>
      </section>

      <section class="section">
        <div class="section-inner trivia-admin">
          <p id="trivia-admin-status" class="trivia-status" role="status"></p>

          <form id="trivia-login" class="contact-form trivia-login" hidden>
            <div class="form-row">
              <label for="admin-email">Email</label>
              <input type="email" id="admin-email" name="email" required autocomplete="username" />
            </div>
            <div class="form-row">
              <label for="admin-password">Password</label>
              <input type="password" id="admin-password" name="password" required autocomplete="current-password" />
            </div>
            <button type="submit" class="btn-primary">Sign in</button>
          </form>

          <form id="trivia-editor" class="trivia-editor" hidden>
            <div class="trivia-editor-bar">
              <div class="form-row">
                <label for="trivia-play-date">Date</label>
                <input type="date" id="trivia-play-date" name="play_date" required />
              </div>
              <button type="button" id="trivia-sign-out" class="btn-secondary">Sign out</button>
            </div>
            <div id="trivia-questions"></div>
            <button type="submit" class="btn-primary">Save this day</button>
          </form>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="trivia-admin.js"></script>
</body>
</html>
